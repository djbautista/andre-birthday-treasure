<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Andre's Birthday Treasure</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Italianno&family=Parisienne&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { height: 100%; }
  .stage {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #E8D5CC;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(232,180,184,0.3), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(200,162,200,0.25), transparent 45%),
      linear-gradient(135deg, #E8D5CC 0%, #D9C0B5 100%);
  }
  .phone-wrap {
    width: 390px; height: 844px;
    position: relative;
    max-height: 100vh;
  }
  @media (max-width: 430px) {
    .stage { background: transparent; }
    .phone-wrap {
      width: 100vw; height: 100vh; max-height: none;
    }
    .phone-wrap .device-bezel { display: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="phone-wrap">
    <div id="root" style="width:100%; height:100%;"></div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const STORAGE_KEY = 'andres-birthday-treasure-state';

function App() {
  // State: { phase: 'intro'|'stop'|'finale', stopIndex: 0..3 }
  // The per-stop sub-phases (guessing→solved→traveling→arrived→letter) live inside StopScreen.
  const [state, setState] = useState(() => {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const s = JSON.parse(saved);
        // Migrate legacy 'transition' phase → next stop
        if (s.phase === 'transition') return { phase: 'stop', stopIndex: Math.min(s.stopIndex + 1, 3) };
        return s;
      }
    } catch {}
    return { phase: 'intro', stopIndex: 0 };
  });

  useEffect(() => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  }, [state]);

  const stops = window.STOPS;

  const goToStop = (i) => setState({ phase: 'stop', stopIndex: i });

  const onStart = () => goToStop(0);
  const onStopComplete = () => {
    const cur = state.stopIndex;
    if (cur >= stops.length - 1) {
      setState({ phase: 'finale', stopIndex: cur });
    } else {
      goToStop(cur + 1);
    }
  };
  const onRestart = () => {
    setState({ phase: 'intro', stopIndex: 0 });
  };

  const Screen = () => {
    switch(state.phase) {
      case 'intro': return <IntroScreen onStart={onStart}/>;
      case 'stop': {
        const stop = stops[state.stopIndex];
        return <StopScreen key={`stop-${state.stopIndex}`} stop={stop} stopIndex={state.stopIndex} onComplete={onStopComplete}/>;
      }
      case 'finale': return <FinaleScreen onRestart={onRestart}/>;
    }
  };

  return (
    <div className="app-shell" data-screen-label={`${state.phase}${state.phase==='stop' ? ' '+(state.stopIndex+1) : ''}`}>
      <div className="app-content">
        <Screen/>
      </div>
      {/* tiny reset chip */}
      {state.phase !== 'intro' && (
        <button onClick={onRestart} style={{
          position:'absolute', top: 12, right: 12, zIndex: 200,
          background:'rgba(255,253,249,0.75)', border:'1px solid rgba(212,145,154,0.3)',
          borderRadius: 999, padding: '4px 10px',
          fontFamily:'"DM Mono", monospace', fontSize: 9,
          letterSpacing:'0.15em', color:'var(--rose-ink)',
          textTransform:'uppercase', cursor:'pointer',
        }}>
          reiniciar
        </button>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
